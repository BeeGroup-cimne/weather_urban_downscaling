version: '3.8'

services:
  # =============================================================
  # TensorFlow Trainer (Primary - Ablation Study)
  # =============================================================
  tf-trainer:
    build:
      context: .
      dockerfile: docker/Dockerfile.tf
    image: weather_thesis:tf
    container_name: weather_tf_trainer
    volumes:
      # Mount data directory (must contain your datasets)
      - ./data:/app/data
      # Mount experiments to persist outputs
      - ./experiments:/app/experiments
    environment:
      - TF_USE_LEGACY_KERAS=1
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
    # GPU support for NVIDIA Docker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: python scripts/run_ablation.py
    restart: "no"

  # =============================================================
  # PyTorch Trainer (Experimental - Mamba SSM)
  # =============================================================
  torch-trainer:
    build:
      context: .
      dockerfile: docker/Dockerfile.torch
    image: weather_thesis:torch
    container_name: weather_torch_trainer
    volumes:
      - ./data:/app/data
      - ./experiments:/app/experiments
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
    # GPU support for NVIDIA Docker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: python scripts/train_torch.py
    restart: "no"

  # =============================================================
  # Data Preprocessing (One-time setup)
  # =============================================================
  data-prep:
    build:
      context: .
      dockerfile: docker/Dockerfile.tf
    image: weather_thesis:tf
    container_name: weather_data_prep
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      python -c " from src.data_loader import BigDataPipeline from config.config import Config import os os.makedirs('/app/data/processed', exist_ok=True) pipeline = BigDataPipeline(Config) pipeline.process_static_data() pipeline.run_etl_process() print('✅ Data preprocessing complete!') "
    restart: "no"
