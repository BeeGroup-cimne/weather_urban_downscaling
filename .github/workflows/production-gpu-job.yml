name: Production GPU Job

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: Compose service to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - forecast-fetch
          - forecast-inference
          - data-health
          - tiles-heatwave
          - fullframe
          - heatwave-alerts
          - heatwave-alerts-live
          - alert-dashboard
      image_ref:
        description: Full image ref. Leave empty to use the current commit image.
        required: false
        type: string

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io

jobs:
  run-production-job:
    runs-on:
      - self-hosted
      - linux
      - gpu
    env:
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_NOTIFY_MIN_LEVEL: ${{ vars.ALERT_NOTIFY_MIN_LEVEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image ref
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          if [ -n "${{ inputs.image_ref }}" ]; then
            echo "WEATHER_IMAGE=${{ inputs.image_ref }}" >> "$GITHUB_ENV"
          else
            echo "WEATHER_IMAGE=${REGISTRY}/${repo}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker compose -f docker/compose.production.yml pull "${{ inputs.run_mode }}"

      - name: Run selected job
        if: inputs.run_mode != 'heatwave-alerts-live' && inputs.run_mode != 'alert-dashboard'
        run: docker compose -f docker/compose.production.yml run --rm "${{ inputs.run_mode }}"

      - name: Start live alert service
        if: inputs.run_mode == 'heatwave-alerts-live'
        run: docker compose -f docker/compose.production.yml up -d heatwave-alerts-live

      - name: Start alert dashboard
        if: inputs.run_mode == 'alert-dashboard'
        run: docker compose -f docker/compose.production.yml up -d alert-dashboard

      - name: Clean stopped containers
        if: always() && inputs.run_mode != 'heatwave-alerts-live' && inputs.run_mode != 'alert-dashboard'
        run: docker compose -f docker/compose.production.yml down --remove-orphans
