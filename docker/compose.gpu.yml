version: '3.8'

services:
  # =============================================================
  # TensorFlow Trainer Optimizado para GPU Server
  # =============================================================
  tf-trainer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tf
    image: weather_thesis:tf
    container_name: weather_tf_trainer
    volumes:
      - ../:/app
      # Mount data directory (must contain your datasets)
      - ../data:/app/data
      # Mount experiments to persist outputs
      - ../experiments:/app/experiments
    environment:
      - TF_USE_LEGACY_KERAS=1
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
      - TF_GPU_ALLOCATOR=cuda_malloc_async
      - MPLCONFIGDIR=/tmp
      - USE_GPU_CONFIG=1
    # GPU support con límites de memoria
    deploy:
      resources:
        limits:
          memory: 32G
          cpus: '8'
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    # Shared memory para PyTorch multiprocessing
    shm_size: '8gb'
    # Command con configuración optimizada
    command: >
      python -c "import sys; sys.path.append('/app'); from config.gpu_server_config import GPUServerConfig; GPUServerConfig.print_memory_info(); from src.optimized_data_pipeline import OptimizedBigDataPipeline; from scripts.gpu_server_train import train_gpu_optimized; train_gpu_optimized()"
    restart: "no"
    profiles:
      - training
      - gpu

  # =============================================================
  # Transformer Trainer Optimizado para GPU Server
  # =============================================================
  transformer-trainer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tf
    image: weather_thesis:transformer
    container_name: weather_transformer_trainer
    volumes:
      - ../data:/app/data
      - ../experiments:/app/experiments
    environment:
      - PYTHONUNBUFFERED=1
      - TF_USE_LEGACY_KERAS=1
      - CUDA_VISIBLE_DEVICES=0
      - TF_GPU_ALLOCATOR=cuda_malloc_async
      - MPLCONFIGDIR=/tmp
      - USE_GPU_CONFIG=1
    deploy:
      resources:
        limits:
          memory: 32G # Transformers necesitan memoria para attention
          cpus: '8'
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    shm_size: '8gb'
    command: >
      python scripts/train_transformer.py
    restart: "no"
    profiles:
      - training
      - gpu

  # =============================================================
  # PyTorch Trainer Optimizado para GPU Server (Mamba)
  # =============================================================
  torch-trainer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.torch
    image: weather_thesis:torch
    container_name: weather_torch_trainer
    volumes:
      - ../data:/app/data
      - ../experiments:/app/experiments
    environment:
      - PYTHONUNBUFFERED=1
      - MPLCONFIGDIR=/tmp
      - CUDA_VISIBLE_DEVICES=0
      - NCCL_DEBUG=WARN
      - USE_GPU_CONFIG=1
    deploy:
      resources:
        limits:
          memory: 48G # Más memoria para Mamba
          cpus: '12'
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    shm_size: '16gb' # Más shared memory para Mamba
    command: >
      python scripts/torch_gpu_train.py
    restart: "no"
    profiles:
      - training
      - gpu

  # =============================================================
  # Data Preprocessing Optimizado
  # =============================================================
  data-prep:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tf
    image: weather_thesis:tf
    container_name: weather_data_prep
    volumes:
      - ../:/app
      - ../data:/app/data
      - ../experiments:/app/experiments
    environment:
      - PYTHONUNBUFFERED=1
      - MPLCONFIGDIR=/tmp
      - USE_GPU_CONFIG=1
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '4'
    command: >
      python -c "import sys; sys.path.append('/app'); from config.gpu_server_config import GPUServerConfig; from src.optimized_data_pipeline import OptimizedBigDataPipeline; print('🚀 Iniciando data preprocessing optimizado...'); GPUServerConfig.print_memory_info(); pipeline = OptimizedBigDataPipeline(GPUServerConfig); pipeline.process_static_data(); from src.data_loader import BigDataPipeline; original_pipeline = BigDataPipeline(GPUServerConfig); original_pipeline.run_etl_process(); print('✅ Data preprocessing complete!');"
    restart: "no"
    profiles:
      - preprocessing

  # =============================================================
  # Memory Monitor Service
  # =============================================================
  memory-monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tf
    image: weather_thesis:monitor
    container_name: weather_memory_monitor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../experiments:/app/experiments
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 2G
    command: >
      python -c " import time, subprocess, json, os; while True:
          try:
              # GPU Memory
              result = subprocess.run(['nvidia-smi', '--query-gpu=memory.used,memory.total', '--format=csv,noheader,nounits'], 
                                    capture_output=True, text=True);
              if result.returncode == 0:
                  used, total = map(int, result.stdout.strip().split(', '));
                  print(f'GPU Memory: {used}MB/{total}MB ({used/total*100:.1f}%)');
              
              # System Memory
              with open('/proc/meminfo', 'r') as f:
                  meminfo = f.read();
                  mem_total = int([line for line in meminfo.split('\\n') if line.startswith('MemTotal:')][0].split()[1]) // 1024;
                  mem_available = int([line for line in meminfo.split('\\n') if line.startswith('MemAvailable:')][0].split()[1]) // 1024;
                  mem_used = mem_total - mem_available;
                  print(f'System Memory: {mem_used}MB/{mem_total}MB ({mem_used/mem_total*100:.1f}%)');
                  
              print('-' * 50);
              time.sleep(30);
          except Exception as e:
              print(f'Monitor error: {e}');
              time.sleep(60);
      "
    restart: "unless-stopped"
    profiles:
      - monitoring

  # =============================================================
  # Jupyter Lab para desarrollo interactivo
  # =============================================================
  jupyter:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tf
    image: weather_thesis:jupyter
    container_name: weather_jupyter
    volumes:
      - ../data:/app/data
      - ../experiments:/app/experiments
      - ../:/app/notebooks
    environment:
      - PYTHONUNBUFFERED=1
      - JUPYTER_ENABLE_LAB=yes
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    ports:
      - "8888:8888"
    shm_size: '4gb'
    command: >
      bash -c " pip install jupyter jupyterlab; cd /app; jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password='' "
    restart: "no"
    profiles:
      - development

# Red personalizada para mejor comunicación entre containers
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
